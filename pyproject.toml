[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coinshop"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Andy Wells" }]
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "D",      # docstrings not required yet
  "CPY001", # no copyright headers
  "COM812", # conflicts with formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"] # assert is expected in tests

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=coinshop --cov-report=term-missing"

[tool.coverage.run]
source = ["src"]
